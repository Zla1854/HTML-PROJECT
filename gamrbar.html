<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game</title>

    <style>
      .game-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        padding: 15px;
        margin: 10px;
        border: 2px solid #bc8764;
        border-radius: 10px;
        background-color: #0e213f;
        color: #f4bf98;
      }
      .game-area {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        background-color: #f7f2e8;
      }
      .game-panel {
        display: flex;
        gap: 20px;
      }
      .controls {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        background-color: #3e1929;
      }
      .inventory {
        background-color: #cdeac0;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        padding: 10px;
        border: 2px solid #bc8764;
        border-radius: 8px;
      }
      .quest {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px;
        margin: px;
        gap: 10px;
        background-color: #4c5c68;
      }
    </style>
  </head>
  <body>
    <header class="game-header">
      <h1 id="game-heading">flexbox quest</h1>

      <div class="game-info">
        <span>Lives :3</span>
        <span>coins :120</span>
        <span>level :1</span>
      </div>

      <div class="header-actions">
        <button>Pause</button>
        <button>Menu</button>
      </div>
    </header>

    <main>
      <section class="game-area">
        <div class="player">PLAYER</div>
        <div class="platform">PLATFORM</div>
        <div class="platform">PLATFORM</div>
        <div class="star">STAR</div>
      </section>

      <section class="game-panel">
        <div class="panel controls">...</div>
        <div class="panel inventory">...</div>
        <div class="panel quest">...</div>
      </section>

      <section>
        <div class="controls">
          <h2>Controls</h2>
          <div class="control-row">
            <button id="up">↑</button>
          </div>
          <div class="control-row">
            <button>→</button>
            <button>↓</button>
            <button>→</button>
          </div>
          <button id="jump">Jump</button>
        </div>
      </section>

      <div class="inventory">
        <h2>Inventory</h2>
        <div class="inventory-items">
          <div class="item">Sword</div>
          <div class="item">Shield</div>
          <div class="item">Potion</div>
          <div class="item">Key</div>
        </div>
      </div>

      <div class="quest">
        <h2>Quest</h2>
        <div class="quest-item">
          <span>Collect 3 Stars</span>
          <span>1 / 3</span>
        </div>
        <div class="quest-item">
          <span>Find the Golden Key</span>
          <span>0 / 1</span>
        </div>
        <div class="quest-item">
          <span>Defeat the Monster</span>
          <span>0 / 1</span>
        </div>
      </div>
    </main>

    <footer></footer>
  </body>
</html>
